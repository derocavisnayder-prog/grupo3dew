    <main class="container">
        <h2>Buzón de Consultas del Estudiante</h2>
        <p>¿Tienes alguna duda sobre los ejercicios de álgebra? Envía tu consulta directamente al profesor a través del siguiente formulario:</p>

        <form id="formConsulta">
            <div class="form-group">
                <label for="nombre">Nombre completo:</label>
                <input type="text" id="nombre" required placeholder="Ej. Juan Pérez">
            </div>

            <div class="form-group">
                <label for="correo">Correo electrónico:</label>
                <input type="email" id="correo" required placeholder="correo@ejemplo.com">
            </div>

            <div class="form-group">
                <label for="mensaje">Consulta o Duda:</label>
                <textarea id="mensaje" rows="4" required placeholder="Escribe tu duda sobre ecuaciones..."></textarea>
            </div>

            <button type="submit" class="btn">Enviar Consulta</button>
        </form>
    </main>
